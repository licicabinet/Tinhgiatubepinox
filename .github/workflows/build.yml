name: Build Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: LICI-Setup-Installer
          path: dist/*Setup*.exe

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: LICI-Portable
          path: dist/*portable*.exe
